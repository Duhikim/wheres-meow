[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wheresmeow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "flask-socketio==5.7.0",
    "simple-websocket==1.1.0",
    "gevent==26.9.0",
    "gevent-websocket==0.10.1",
    "pydantic==2.14.1",
    "itsdangerous==2.2.0",
    "sqlalchemy==2.1.4",
    "alembic==1.20.0",
    "pg8000==1.31.5",
    "argon2-cffi==25.1.0",
    "pyjwt==2.15.1",
    "flask-limiter==4.1.1",
    "authlib==1.8.0",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
# 테스트는 짧은 서명 키를 쓴다. 운영 키 길이는 AppConfig 가 32바이트 이상으로 강제한다.
filterwarnings = ["ignore::jwt.warnings.InsecureKeyLengthWarning"]
